<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">
</head>
<body class="page_inscription">
    <div class="inscription_container">
        <form id="form_inscription" class="inscription" action="{{ url_for('register') }}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <h1>Créer un compte</h1>
            <p class="sous_titre">Remplissez le formulaire pour vous inscrire.</p>

            <div class="ligne_inscription">
                <div class="champ_inscription">
                    <label for="id_nom">Nom <span class="asterisque">*</span></label>
                    <input type="text" name="nom" id="id_nom" placeholder="Nom"
                        value="{{ form.get('nom', '') }}" required maxlength="100" autocomplete="family-name">
                </div>
                <div class="champ_inscription">
                    <label for="id_prenom">Prénom <span class="asterisque">*</span></label>
                    <input type="text" name="prenom" id="id_prenom" placeholder="Prénom"
                        value="{{ form.get('prenom', '') }}" required maxlength="100" autocomplete="given-name">
                </div>
            </div>

            <div class="champ_inscription">
                <label for="id_mail">Adresse mail <span class="asterisque">*</span></label>
                <input type="email" name="email" id="id_mail" placeholder="nom@domaine.com"
                    value="{{ form.get('email', '') }}" required maxlength="254" autocomplete="email">
            </div>

            <div class="champ_inscription">
                <label for="id_phone">Numéro de téléphone</label>
                <input type="tel" name="phone" id="id_phone" placeholder="Facultatif"
                    value="{{ form.get('phone', '') }}" maxlength="20" autocomplete="tel">
            </div>

            <div class="champ_inscription">
                <label for="id_pass">Mot de passe <span class="asterisque">*</span></label>
                <input type="password" name="password" id="id_pass" placeholder="8 caractères minimum"
                    required minlength="8" maxlength="128" autocomplete="new-password">
            </div>

            <div class="champ_inscription">
                <label for="id_pass_confirm">Confirmer le mot de passe <span class="asterisque">*</span></label>
                <input type="password" name="password_confirm" id="id_pass_confirm"
                    required minlength="8" maxlength="128" autocomplete="new-password">
            </div>

            {% if erreurs %}
            <ul id="message" class="erreur">
                {% for e in erreurs %}<li>{{ e }}</li>{% endfor %}
            </ul>
            {% endif %}

            <input type="submit" value="S'inscrire">

            <p class="text_info"><span class="asterisque">*</span> Champ obligatoire</p>
            <p id="text_nouv">Vous êtes déjà inscrit ? <a href="{{ url_for('login') }}">Connectez-vous</a></p>
        </form>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
